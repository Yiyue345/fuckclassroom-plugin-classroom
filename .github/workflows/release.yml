name: Release plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.0 or 0.1.0-beta.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid SemVer: ${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"
          if [[ "${VERSION}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build Registry v1 artifact
        id: package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          python scripts/build_registry_artifact.py "${VERSION}"
          echo "asset=classroom-${VERSION}.zip" >> "${GITHUB_OUTPUT}"

      - name: Verify checksum
        shell: bash
        run: sha256sum -c "${{ steps.package.outputs.asset }}.sha256"

      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists"
          else
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "${TAG}"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          ASSET="${{ steps.package.outputs.asset }}"
          PRERELEASE="${{ steps.version.outputs.prerelease }}"
          FLAGS=()
          if [[ "${PRERELEASE}" == "true" ]]; then FLAGS+=(--prerelease); fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSET}" "${ASSET}.sha256" --clobber
          else
            gh release create "${TAG}" "${ASSET}" "${ASSET}.sha256"               --title "${TAG}" --generate-notes "${FLAGS[@]}"
          fi
