name: Publish beta

on:
  workflow_run:
    workflows: ["Test plugin"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: write

jobs:
  beta:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve beta version
        id: version
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path("plugin.json").read_text(encoding="utf-8"))
          base = str(manifest["version"]).split("-", 1)[0]
          beta = f"{base}-beta.{os.environ['GITHUB_RUN_NUMBER']}"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"version={beta}\n")
              out.write(f"tag=v{beta}\n")

      - name: Build Registry v1 artifact
        id: package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          python scripts/build_registry_artifact.py "${VERSION}"
          echo "asset=classroom-${VERSION}.zip" >> "${GITHUB_OUTPUT}"

      - name: Verify checksum
        shell: bash
        run: sha256sum -c "${{ steps.package.outputs.asset }}.sha256"

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          ASSET="${{ steps.package.outputs.asset }}"
          git tag "${TAG}" "${SHA}"
          git push origin "${TAG}"
          gh release create "${TAG}"             "${ASSET}" "${ASSET}.sha256"             --target "${SHA}"             --title "${TAG}"             --generate-notes             --prerelease
